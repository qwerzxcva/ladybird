name: Build Android ARMv8 APK

on:
  push:
    branches: [ master, main, android-port ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13599879
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            ccache \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            python3-pip \
            unzip \
            curl \
            git

      - name: Setup vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure Android NDK
        run: |
          # Ensure the expected NDK version exists or symlink available one
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            AVAILABLE_NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -n "$AVAILABLE_NDK" ]; then
              echo "Using available NDK: $AVAILABLE_NDK"
              ln -sf "$AVAILABLE_NDK" "$ANDROID_NDK_HOME" || export ANDROID_NDK_HOME="$AVAILABLE_NDK"
            else
              echo "ERROR: No Android NDK found"
              exit 1
            fi
          fi
          echo "NDK path: $ANDROID_NDK_HOME"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-arm64-${{ hashFiles('Libraries/**/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-android-arm64-

      - name: Grant execute permission to build script
        run: chmod +x build_android_arm64.sh

      - name: Build Android ARMv8 APK
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          ./build_android_arm64.sh
        shell: bash

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-android-arm64-debug
          path: UI/Android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            UI/Android/app/build/
            build/
            vcpkg/buildtrees/**/*.log
          retention-days: 7
