name: Build Android ARMv8 APK

on:
  push:
    branches: [ master, main, android-port ]
  workflow_dispatch:

env:
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libgl1-mesa-dev python3-pip unzip curl git

      - name: Setup vcpkg
        run: |
          if [ ! -d "${{ github.workspace }}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          fi
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-arm64-${{ hashFiles('Libraries/**/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: ccache-android-arm64-

      - name: Build Android ARMv8 APK via Gradle
        working-directory: ${{ github.workspace }}/UI/Android
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/26.1.10909125"
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Xmx4096m'

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-android-arm64-debug
          path: UI/Android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            UI/Android/app/build/
            Build/
            vcpkg/buildtrees/**/*.log
          retention-days: 7
